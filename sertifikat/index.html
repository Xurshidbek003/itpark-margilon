<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sertifikatni tekshirish — IT Park Marg'ilon</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ecfaf3" />
  <link rel="icon" type="image/png" href="../images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600&display=swap" rel="stylesheet" />
  <style>
    :root { --text: #1b2a24; --muted: #6d7d75; --line: #e4ece7; --em: #22c58b; --em-dark: #0f8a5f; --em-soft: #dcf6ea; --red: #c24848; --red-soft: #fde6e6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, system-ui, sans-serif; color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
      background: radial-gradient(circle at 10% 0%, #d6f6e7, transparent 40%), radial-gradient(circle at 100% 100%, #dcedff, transparent 40%), #f6faf8; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1080px, 100% - 32px); margin: 0 auto; padding: 22px 0 60px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .brand img { width: 38px; height: 38px; object-fit: contain; display: block; }
    .brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
    .site { font-weight: 700; font-size: 14px; color: var(--em-dark); }
    .status { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 18px; background: #fff; box-shadow: 0 10px 30px -18px rgba(27,42,36,.25); margin-bottom: 20px; }
    .status__icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex: none; background: var(--em-soft); color: var(--em-dark); }
    .status b { display: block; font-size: 17px; }
    .status span { color: var(--muted); font-size: 14px; }
    .status.is-bad .status__icon { background: var(--red-soft); color: var(--red); }
    .status.is-bad b { color: var(--red); }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
    .btn { display: inline-flex; align-items: center; gap: 9px; padding: 14px 24px; border-radius: 999px; font: 700 15px Manrope, sans-serif; border: 0; cursor: pointer; transition: transform .2s, background .2s; }
    .btn:active { transform: scale(.97); }
    .btn--primary { background: var(--em); color: #fff; box-shadow: 0 10px 26px -12px rgba(34,197,139,.8); }
    .btn--primary:hover { background: #1db47e; }
    .btn--ghost { background: #fff; color: var(--text); box-shadow: inset 0 0 0 1.5px var(--line); }
    .btn[disabled] { opacity: .6; pointer-events: none; }
    .empty { text-align: center; padding: 70px 20px; background: #fff; border-radius: 22px; box-shadow: 0 10px 30px -18px rgba(27,42,36,.25); }
    .empty h1 { font-family: Unbounded, sans-serif; font-weight: 600; font-size: 24px; margin: 14px 0 8px; }
    .empty p { color: var(--muted); margin: 0; }
    .search { display: flex; gap: 8px; max-width: 380px; margin: 22px auto 0; }
    .search input { flex: 1; min-width: 0; padding: 13px 16px; border-radius: 999px; border: 1.5px solid var(--line); font: 600 16px Manrope, sans-serif; outline: 0; letter-spacing: .08em; text-align: center; }
    .search input:focus { border-color: var(--em); }
    .note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
    .loading { text-align: center; color: var(--muted); padding: 80px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="../"><img src="../images/logo.png" alt="IT Park" width="38" height="38" /><span>IT Park<small>Marg'ilon</small></span></a>
      <a class="site" href="../">Saytga o'tish →</a>
    </header>
    <main id="main"><div class="loading">Sertifikat tekshirilmoqda...</div></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../config.js?v=5"></script>
  <script src="../cert.js?v=5"></script>
  <script>
  (async () => {
    const main = document.getElementById("main");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const n = (new URLSearchParams(location.search).get("n") || "").replace(/\D/g, "").slice(0, 12);
    const searchForm = `<form class="search" id="sf"><input id="sn" inputmode="numeric" placeholder="Sertifikat raqami" value="${esc(n)}" /><button class="btn btn--primary" type="submit">Tekshirish</button></form>`;
    const bindSearch = () => { const f = document.getElementById("sf"); if (f) f.onsubmit = (e) => { e.preventDefault(); const v = document.getElementById("sn").value.replace(/\D/g, ""); if (v) location.search = "?n=" + v; }; };
    const showEmpty = (icon, title, text) => { main.innerHTML = `<div class="empty"><div style="font-size:44px">${icon}</div><h1>${title}</h1><p>${text}</p>${searchForm}</div>`; bindSearch(); };

    if (!n) return showEmpty("🔎", "Sertifikatni tekshirish", "Sertifikatdagi QR kodni skanerlang yoki raqamini kiriting.");
    const cfg = window.APP_CONFIG || {};
    if (!cfg.supabaseUrl || !window.supabase) return showEmpty("⚠️", "Tekshirish vaqtincha ishlamayapti", "Birozdan so'ng qayta urinib ko'ring.");
    const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: false } });
    const [c, t] = await Promise.all([
      sb.rpc("get_certificate", { p_number: n }),
      sb.from("settings").select("value").eq("key", "certificate").maybeSingle(),
    ]);
    if (c.error) return showEmpty("⚠️", "Server bilan aloqa yo'q", "Internetni tekshirib, qayta urinib ko'ring.");
    const cert = c.data && c.data[0];
    if (!cert) return showEmpty("❌", "Sertifikat topilmadi", `«${esc(n)}» raqamli sertifikat ro'yxatda yo'q. Raqamni tekshirib, qayta urinib ko'ring.`);
    const tpl = (t.data && t.data.value) || {};
    const UZ_M = ["yanvar", "fevral", "mart", "aprel", "may", "iyun", "iyul", "avgust", "sentabr", "oktabr", "noyabr", "dekabr"];
    const dt = new Date(cert.issued_at + "T00:00:00");
    const date = `${dt.getFullYear()}-yil ${dt.getDate()}-${UZ_M[dt.getMonth()]}`;
    document.title = `${cert.full_name} — sertifikat №${cert.number}`;
    main.innerHTML = `
      <div class="status ${cert.revoked ? "is-bad" : ""}">
        <span class="status__icon">${cert.revoked ? "⛔" : "✓"}</span>
        <div><b>${cert.revoked ? "Bu sertifikat bekor qilingan" : "Sertifikat haqiqiy"}</b>
        <span>${esc(cert.full_name)} · ${esc(cert.course)} · №${esc(cert.number)} · ${esc(date)}</span></div>
      </div>
      <div id="cert"></div>
      ${cert.revoked ? "" : `<div class="actions">
        <button class="btn btn--primary" id="dlPdf">⬇ Yuklab olish (PDF)</button>
        <button class="btn btn--ghost" id="dlPng">🖼 Rasm sifatida (PNG)</button>
      </div>`}
      <p class="note">Ushbu sahifa IT Park Marg'ilon o'quv markazi tomonidan berilgan sertifikatning haqiqiyligini tasdiqlaydi.</p>`;
    await window.Cert.mount(document.getElementById("cert"), cert, tpl);
    const dl = async (btn, type) => {
      const label = btn.textContent; btn.disabled = true; btn.textContent = "Tayyorlanmoqda...";
      try { await window.Cert.download(cert, tpl, type); } catch (e) { alert("Yuklab bo'lmadi: " + e.message); }
      btn.disabled = false; btn.textContent = label;
    };
    const p = document.getElementById("dlPdf"), g = document.getElementById("dlPng");
    if (p) p.onclick = () => dl(p, "pdf");
    if (g) g.onclick = () => dl(g, "png");
  })();
  </script>
</body>
</html>
